<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legater – finn stipend og legater</title>
<meta name="description" content="Filtrer norske legater og stipender etter nivå, fag, studiested og type.">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1f24; --muted: #646a73; --line: #e3dfd6;
    --accent: #2f5d50; --accent-ink: #ffffff; --chip: #ece8de; --soon: #b4541f; --past: #9aa0a8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --card: #1e2125; --ink: #eceae6; --muted: #9ba1a9; --line: #2e3237;
      --accent: #7fb8a4; --accent-ink: #10201b; --chip: #2a2e33; --soon: #f0a066; --past: #6b7178; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { font: 600 2.2rem/1.1 Georgia, "Times New Roman", serif; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  .controls { margin: 28px 0 8px; display: grid; gap: 14px; }
  .search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font: inherit; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .group > span { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    width: 92px; flex-shrink: 0; }
  .chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 999px;
    padding: 5px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .chip:focus-visible, .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 18px 0 12px; color: var(--muted); font-size: .9rem; }
  .bar button { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }
  .bar select { font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 8px; }
  .list { display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; }
  .card h2 { font-size: 1.08rem; margin: 0; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .giver { color: var(--muted); font-size: .88rem; }
  .desc { grid-column: 1 / -1; margin: 8px 0 4px; }
  .belop { grid-column: 1 / -1; font-size: .92rem; }
  .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { font-size: .75rem; padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--muted); }
  .frist { text-align: right; font-size: .85rem; white-space: nowrap; }
  .frist strong { display: block; font-size: 1rem; }
  .frist.snart strong { color: var(--soon); }
  .frist .ukjent { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { margin-top: 40px; color: var(--muted); font-size: .88rem; border-top: 1px solid var(--line); padding-top: 16px; }
  footer a { color: var(--accent); }
  @media (max-width: 600px) {
    .group > span { width: 100%; }
    .card { grid-template-columns: 1fr; }
    .frist { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Legater</h1>
    <p>Stipender og legater for norske elever og studenter – filtrer på det som passer deg.</p>
  </header>

  <div class="controls">
    <input class="search" id="sok" type="search" placeholder="Søk etter navn, universitet, fag …" aria-label="Søk">
    <div id="filtre"></div>
  </div>

  <div class="bar">
    <span id="antall"></span>
    <span>
      <label>Sorter
        <select id="sorter">
          <option value="frist">Neste frist</option>
          <option value="navn">Navn</option>
        </select>
      </label>
      &nbsp;·&nbsp; <button id="nullstill" type="button">Nullstill filtre</button>
    </span>
  </div>

  <div class="list" id="liste" aria-live="polite"></div>

  <footer>
    <p id="oppdatert"></p>
    <p>Frister og beløp endres fra år til år – sjekk alltid kilden før du søker. Flere kilder: <span id="kilder"></span></p>
  </footer>
</div>

<script>
const state = { sok: "", valgt: {}, sorter: "frist" };
let DATA = null;
const MND = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];

function nesteFrist(f) {
  if (!f) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  let d = new Date(now.getFullYear(), f.mnd - 1, f.dag);
  if (d < now) d = new Date(now.getFullYear() + 1, f.mnd - 1, f.dag);
  return d;
}

function lesUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of Object.keys(DATA.kategorier)) {
    const v = p.get(k); state.valgt[k] = new Set(v ? v.split(",") : []);
  }
  state.sok = p.get("q") || "";
  state.sorter = p.get("sort") || "frist";
}
function skrivUrl() {
  const p = new URLSearchParams();
  for (const [k, s] of Object.entries(state.valgt)) if (s.size) p.set(k, [...s].join(","));
  if (state.sok) p.set("q", state.sok);
  if (state.sorter !== "frist") p.set("sort", state.sorter);
  history.replaceState(null, "", p.toString() ? "#" + p : location.pathname);
}

function byggFiltre() {
  const root = document.getElementById("filtre");
  root.innerHTML = "";
  for (const [k, kat] of Object.entries(DATA.kategorier)) {
    const g = document.createElement("div"); g.className = "group";
    g.innerHTML = `<span>${kat.navn}</span>`;
    for (const [v, label] of Object.entries(kat.verdier)) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", state.valgt[k].has(v));
      b.onclick = () => {
        state.valgt[k].has(v) ? state.valgt[k].delete(v) : state.valgt[k].add(v);
        b.setAttribute("aria-pressed", state.valgt[k].has(v));
        tegn();
      };
      g.appendChild(b);
    }
    root.appendChild(g);
  }
}

function passer(l) {
  for (const [k, s] of Object.entries(state.valgt)) {
    if (!s.size) continue;
    const verdier = l[k] || [];
    // "Alle fag" matcher alltid et valgt fag
    if (k === "fag" && verdier.includes("alle")) continue;
    if (!verdier.some(v => s.has(v))) return false;
  }
  if (state.sok) {
    const hay = [l.navn, l.giver, l.beskrivelse, l.belop].join(" ").toLowerCase();
    if (!state.sok.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function tegn() {
  skrivUrl();
  const items = DATA.legater.filter(passer).map(l => ({ ...l, _neste: nesteFrist(l.frist) }));
  items.sort(state.sorter === "navn"
    ? (a, b) => a.navn.localeCompare(b.navn, "nb")
    : (a, b) => (a._neste ?? Infinity) - (b._neste ?? Infinity) || a.navn.localeCompare(b.navn, "nb"));

  document.getElementById("antall").textContent =
    `${items.length} av ${DATA.legater.length} ordninger`;
  const liste = document.getElementById("liste");
  if (!items.length) { liste.innerHTML = `<div class="empty">Ingen treff. Prøv færre filtre.</div>`; return; }

  const now = new Date();
  liste.innerHTML = items.map(l => {
    let frist = `<span class="ukjent">${l.fristTekst}</span>`, snart = false;
    if (l._neste) {
      const dager = Math.round((l._neste - now) / 864e5);
      snart = dager <= 45;
      frist = `<strong>${l._neste.getDate()}. ${MND[l._neste.getMonth()]} ${l._neste.getFullYear()}</strong>
               ${dager <= 0 ? "i dag" : `om ${dager} dager`}`;
    }
    const tags = Object.keys(DATA.kategorier).flatMap(k =>
      (l[k] || []).map(v => `<span class="tag">${DATA.kategorier[k].verdier[v] || v}</span>`)).join("");
    return `<article class="card">
      <div><h2><a href="${l.lenke}" target="_blank" rel="noopener">${l.navn}</a></h2>
        <div class="giver">${l.giver}</div></div>
      <div class="frist ${snart ? "snart" : ""}">${frist}</div>
      <p class="desc">${l.beskrivelse}</p>
      <div class="belop"><b>Beløp:</b> ${l.belop}${l._neste ? ` · <b>Frist:</b> ${l.fristTekst}` : ""}</div>
      <div class="tags">${tags}</div>
    </article>`;
  }).join("");
}

fetch("legater.json").then(r => r.json()).then(d => {
  DATA = d;
  lesUrl();
  document.getElementById("sok").value = state.sok;
  document.getElementById("sorter").value = state.sorter;
  byggFiltre();
  document.getElementById("oppdatert").textContent = `Sist gjennomgått: ${d.sistOppdatert.split("-").reverse().join(".")}`;
  document.getElementById("kilder").innerHTML = d.andreKilder
    .map(k => `<a href="${k.lenke}" target="_blank" rel="noopener">${k.navn}</a>`).join(" · ");
  document.getElementById("sok").oninput = e => { state.sok = e.target.value.trim(); tegn(); };
  document.getElementById("sorter").onchange = e => { state.sorter = e.target.value; tegn(); };
  document.getElementById("nullstill").onclick = () => {
    Object.values(state.valgt).forEach(s => s.clear()); state.sok = "";
    document.getElementById("sok").value = ""; byggFiltre(); tegn();
  };
  tegn();
}).catch(() => {
  document.getElementById("liste").innerHTML = `<div class="empty">Kunne ikke laste legater.json.</div>`;
});
</script>
</body>
</html>
